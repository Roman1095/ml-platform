services:

  db:
    image: postgres:17-bookworm
    container_name: ml_platform_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: ./backend

    container_name: ml_platform_api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend/app:/app/app
      - ./storage:/data/storage
      - ./models:/data/models
      - ./logs:/data/logs

    ports:
      - "8000:8000"

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]


  worker:
    build:
      context: ./backend

    container_name: ml_platform_worker
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./storage:/data/storage
      - ./models:/data/models
      - ./logs:/data/logs

    command:
      [
        "python",
        "-m",
        "app.worker"
      ]


volumes:
  postgres_data: